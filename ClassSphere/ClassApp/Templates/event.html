{% extends "base.html" %}   
{% load static %}
{% block content %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/Event.css' %}">
  <div class="MainContainer">
      <div class="sidebar">
          <h2>Filter Events :</h2>
          <div class="filters-container">
            <form method="post">
              {% csrf_token %}
              <div class="searchbytitle">
                  <input type="text" name="title" id="title" placeholder="Search by Title">
                  <hr>
              </div>
              <div class="selection-group">
                  <label class="ios-checkbox red">
                      <input type="checkbox" name="paidstatus" value="paid" id="paidstatus" onclick="toggleCheckbox2(this)">
                      <div class="checkbox-wrapper">
                        <div class="checkbox-bg"></div>
                        <svg fill="none" viewBox="0 0 24 24" class="checkbox-icon">
                          <path
                            stroke-linejoin="round"
                            stroke-linecap="round"
                            stroke-width="3"
                            stroke="currentColor"
                            d="M4 12L10 18L20 6"
                            class="check-path"
                          ></path>
                        </svg>
                      </div>
                      <span>Paid</span>
                  </label>
                  <label class="ios-checkbox red">
                      <input type="checkbox" name="paidstatus" id="paidstatus"  onclick="toggleCheckbox2(this)">
                      <div class="checkbox-wrapper">
                        <div class="checkbox-bg"></div>
                        <svg fill="none" viewBox="0 0 24 24" class="checkbox-icon">
                          <path
                            stroke-linejoin="round"
                            stroke-linecap="round"
                            stroke-width="3"
                            stroke="currentColor"
                            d="M4 12L10 18L20 6"
                            class="check-path"
                          ></path>
                        </svg>
                      </div>
                      <span>Unpaid</span>
                  </label>
              </div>
              <div class="selection-group">
                  <label class="ios-checkbox blue">
                      <input type="checkbox" name="timeFilter"  id="timeFilter" value="Month" onclick="toggleCheckbox(this)">
                      <div class="checkbox-wrapper">
                        <div class="checkbox-bg"></div>
                        <svg fill="none" viewBox="0 0 24 24" class="checkbox-icon">
                          <path
                            stroke-linejoin="round"
                            stroke-linecap="round"
                            stroke-width="3"
                            stroke="currentColor"
                            d="M4 12L10 18L20 6"
                            class="check-path"
                          ></path>
                        </svg>
                      </div>
                      <span>This Month</span>
                  </label>
                  <label class="ios-checkbox blue">
                      <input type="checkbox" name="timeFilter"  value="week" id="timeFilter" onclick="toggleCheckbox(this)">
                      <div class="checkbox-wrapper">
                        <div class="checkbox-bg"></div>
                        <svg fill="none" viewBox="0 0 24 24" class="checkbox-icon">
                          <path
                            stroke-linejoin="round"
                            stroke-linecap="round"
                            stroke-width="3"
                            stroke="currentColor"
                            d="M4 12L10 18L20 6"
                            class="check-path"
                          ></path>
                        </svg>
                      </div>
                      <span>This Week</span>
                  </label>
              </div>
              <div class="button-group">
                  <button class="filter-btn apply-btn" id="Filter" >Search</button>
                  <button class="filter-btn clear-btn" id="Clear">Clear</button>
              </div>
            </form>
          </div>
          <h4>Search by Category</h4>
          <div class="category-container">
            <button class="category"><i class="fas fa-music"></i> Music</button>
            <button class="category"><i class="fas fa-paint-brush"></i> Arts</button>
            <button class="category"><i class="fas fa-futbol"></i> Sports</button>
            <button class="category"><i class="fas fa-chalkboard-teacher"></i> Education</button>
            <button class="category"><i class="fas fa-theater-masks"></i> Drama</button>
            <button class="category"><i class="fas fa-book"></i> Literature</button>
            <button class="category"><i class="fas fa-laptop-code"></i> Computer Science</button>
            <button class="category"><i class="fas fa-flask"></i> Science</button>
            <button class="category"><i class="fas fa-calculator"></i> Mathematics</button>
            <button class="category"><i class="fas fa-language"></i> Languages</button>
            <button class="category"><i class="fas fa-school"></i> School Events</button>
            <button class="category"><i class="fas fa-users"></i> Club Activities</button>
            <button class="category"><i class="fas fa-cogs"></i> Robotics</button>
            <button class="category"><i class="fas fa-palette"></i> Design</button>
            <button class="category"><i class="fas fa-people-arrows"></i> Leadership</button>
        </div>
        
      </div>
      <!-- Dynamic Events Loaded here By Detch JavScript -->
      <div class="main" id="eventsContainer"></div>
      </div>
  </div>
  <br>
{% include 'Footer.html'%}
  <script>

    function toggleCheckbox(selectedCheckbox) {
      let checkboxes = document.getElementsByName("timeFilter");  
      checkboxes.forEach((checkbox) => {
          if (checkbox !== selectedCheckbox) {
              checkbox.checked = false;
          }
      });
  }

  function toggleCheckbox2(selectedCheckbox) {
      let checkboxes = document.getElementsByName("paidstatus");  
      checkboxes.forEach((checkbox) => {
          if (checkbox !== selectedCheckbox) {
              checkbox.checked = false;
          }
      });
  }

   document.addEventListener("DOMContentLoaded", () => {
    fetch('http://127.0.0.1:8000/events/all/')
        .then(response =>{
          console.log(response)
          return response.json()
        } )
        .then(data => {
            let eventsContainer = document.getElementById('eventsContainer');
            eventsContainer.innerHTML = ""; 
            data.forEach(event => {
                eventsContainer.innerHTML += `
                   <div class="card">
                      <div class="card-img-holder">
                          <img src="${event.eventbanner}" alt="Event Image">
                      </div>
                      <h3 class="blog-title">${event.title}</h3>
                      <div class="address">
                      <span class="blog-time">
                          <i class="fas fa-clock"></i> 
                          ${new Date(event.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </span>
                          <span class="location">
                              <i class="fas fa-map-marker-alt"></i> 
                              ${event.location}
                          </span>
                      </div>
                      <p class="description">${event.description}</p>
                      <div class="options">
                          <span><a href="/detail/${event.id}" style="text-decoration: none;">Read More</a></span>
                          <button class="btn">Register</button>
                      </div>
                  </div>
                `;
            });
        })
        .catch(error => console.error("Error fetching events:", error));
});

document.getElementById('Filter').addEventListener("click", function(event) {
  event.preventDefault()
    const csrf = "{{ csrf_token }}";  
    console.log(csrf)
    const header = {
        'X-CSRFToken': csrf,  
        'Content-Type': 'application/json'
    };

    const title = document.getElementById('title').value;
    const week = document.querySelector('input[name="timeFilter"][value="week"]').checked;
    const month = document.querySelector('input[name="timeFilter"][value="Month"]').checked;
    const paid = document.querySelector('input[name="paidstatus"][value="paid"]').checked;
    const unpaid = document.querySelector('input[name="paidstatus"]:not([value="paid"])').checked;

    const formData = {
        title: title,
        timeFilter: week ? 'week' : (month ? 'month' : ''),
        paidstatus: paid ? 'paid' : (unpaid ? 'unpaid' : '')
    };

    fetch('http://127.0.0.1:8000/events/filter/',{
        method: 'POST',
        headers: header,
        body: JSON.stringify(formData)
    })
    .then(response => {
      console.log(response)
      return response.json()
    })
    .then(data => {
      console.log(data)
        let eventsContainer = document.getElementById('eventsContainer');
        eventsContainer.innerHTML = "";  
        data.events.forEach(event => {
            eventsContainer.innerHTML += `
                <div class="card">
                    <div class="card-img-holder">
                        <img src="${event.eventbanner}" alt="Event Image">
                    </div>
                    <h3 class="blog-title">${event.title}</h3>
                    <div class="address">
                        <span class="blog-time">
                            <i class="fas fa-clock"></i> 
                            ${new Date(event.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                        <span class="location">
                            <i class="fas fa-map-marker-alt"></i> 
                            ${event.location}
                        </span>
                    </div>
                    <p class="description">${event.description}</p>
                    <div class="options">
                        <span><a href="/events/${event.id}" style="text-decoration: none;">Read More</a></span>
                        <button class="btn">Register</button>
                    </div>
                </div>
            `;
        });
    })
    .catch(error => console.error("Error fetching events:", error));
});
</script>

  {% endblock %}
