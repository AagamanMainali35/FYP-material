<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | ClassSphere</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: hsl(206, 54%, 97%);
            color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
            background-image: url(../static/images/loginBG.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
            
        }
        
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        
        .text {
            margin-bottom: 2rem;
        }
        
        .text p:first-child {
            font-size: 5rem;
            font-weight: 700;
            color: #9085EB;
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        
        .text p:last-child {
            font-size: 30px;
            font-weight: 600;
            color: #2c3e50;
            margin-top: 1rem;
        }
        
        .img img {
            display: block;
            width: 37rem;
            height: 20rem;
            margin-left: -4rem;
        }
        
        .btn {
            margin-top: 4rem;
        }
        
        .btn a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #9085EB;
            text-decoration: none;
            color: white;
            width: 10rem;
            height: 3rem;
            border: 2px solid #2c3e50;
            border-radius: 12px;    
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn a:hover {
            background-color: #7a6fdf;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">
            <p id="num">0</p> 
            <p>Uh Oh! Looks like you got lost</p>
        </div>
        <div class="img">
            <img src="../static/images/404bgno.png" alt="Lost student illustration">
        </div>
        <div class="btn">
            <a href="{% url 'homepage'%}">Go back</a>
        </div>
    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        number=document.getElementById('num')
        for( let i=0;i<=404;i++){
            setTimeout(()=>{
                number.textContent=i
            },i*2)
        }
    });


</script>
</html>
