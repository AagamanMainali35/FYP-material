{% extends "Include and Base Pages/base.html" %} 
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/eventpage.css'%}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <body>
    <style>
        .imgcontainer{
            margin-top: -45px;
            height: 564px;
            width:660px;
            border: 3px solid black;
            border-radius: 100px;
        }
        .imgcontainer img {
            border-radius: 100px;
            width: 100%;
            height: 100%; 
            object-fit: cover;
            object-position: center;
        }
    </style>
    <header class="header__container">
    {% if obj%}
      <div class="header__content">
        <h1>LET'S GO! <span> Get Experience</span> </h1>
        <p>
          {{obj.description|truncatewords:50}}
        </p>
        <form action="/">
          <div class="input__row">
            <div class="input__group">
              <h5>Destination</h5>
              <div>
                <span><i class="fa-solid fa-location-dot"></i></span>
                <input type="text" placeholder="{{obj.location}}" />
              </div>
            </div>
            <div class="input__group">
              <h5>Date</h5>
              <div>
                <span><i class="fa-solid fa-clock"></i></span>
                <input type="text" placeholder="{{ obj.date|date:'d F Y' }}" />
              </div>
            </div>
          </div>
          <button type="submit">Register</button>
        </form>
      </div>
      <div class="imgcontainer">
        <img src="{{obj.eventbanner.url}}" alt="">
      </div>
    </header>
    {% endif %}
  </body>
  {% include 'Include and Base Pages/Footer.html'%}
{% endblock%}
