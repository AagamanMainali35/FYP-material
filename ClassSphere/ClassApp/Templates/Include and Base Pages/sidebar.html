        <!DOCTYPE html>
        <html lang="en">
        <head>
            {% load static%}
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>
            <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <body>
            <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
            :root {
                --body-color: #F5F5F5;
                --sidebar-color: #FFF;
                --primary-color: #695CFE;
                --primary-color-light: #F6F5FF;
                --toggle-color: #DDD;
                --text-color: #707070;
                --tran-05: all 0.3s ease;
            }
            nav{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Poppins', sans-serif;
            }


            ::selection {
                background-color: var(--primary-color);
                color: #fff;
            }

            .sidebar {
                position: fixed;
                        top: 0;
                left: 0;
                height: 100vh;
                width: 300px;
                padding: 10px 14px;
                background: var(--sidebar-color);
                transition: all 0.3s ease;
                z-index: 100;
                box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.1);
                border-bottom-right-radius: 10px;

            }

            .sidebar.close {
                width: 88px;
            }

            .sidebar li {
                height: 50px;
                list-style: none;
                display: flex;
                align-items: center;
                margin-top: 10px;
            }

            .sidebar .icon {
                min-width: 60px;
                border-radius: 6px;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                color: var(--text-color);
                transition: all 0.3s ease;
            }

            .sidebar .text {
                font-size: 17px;
                font-weight: 500;
                white-space: nowrap;
                color: var(--text-color);
                transition:all 0.3s ease;
            }

            .sidebar.close .text {
                opacity: 0;
            }

            .image-text {
                display: flex;
                gap: 10px;
                margin-top: 13px;
                margin-bottom: 6px;
                margin-left: 9px;
            }

            .sidebar header {
                position: relative;
                display: flex;
                align-items: center;
                margin-bottom: 12px;
            }

            .sidebar header .image img {
                width: 25px;
                border-radius: 6px;
            }

            .sidebar header .toggle {
                position: absolute;
                top: 50%;
                right: -25px;
                transform: translateY(-50%) rotate(180deg);
                height: 25px;
                width: 25px;
                background-color: var(--primary-color);
                color: var(--sidebar-color);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                cursor: pointer;
                transition:all 0.3s ease;
            }

            .sidebar.close .toggle {
                transform: translateY(-50%) rotate(0deg);
            }

            .sidebar .menu-bar {
                height: calc(100% - 55px);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow-y: auto;
            }

            .menu-bar::-webkit-scrollbar {
                display: none;
            }

            .sidebar li.search-box {
                border-radius: 6px;
                background-color: var(--primary-color-light);
                cursor: pointer;
            }

            .sidebar li.search-box input {
                height: 100%;
                width: 100%;
                outline: none;
                border: none;
                background-color: var(--primary-color-light);
                color: var(--text-color);
                border-radius: 6px;
                font-size: 17px;
                font-weight: 500;
            }

            .sidebar li a {
                height: 100%;
                display: flex;
                align-items: center;
                width: 100%;
                border-radius: 6px;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .sidebar li a:hover {
                background-color: var(--primary-color);
            }

            .sidebar li a:hover .icon,
            .sidebar li a:hover .text {
                color: var(--sidebar-color);
            }
            ul.menu-links{
                padding: 0px;
            }
            </style>
            <nav class="sidebar">
                <header >
                    <div class="image-text">
                        <a  href="{%url 'homepage'%}" style="border: none; display:flex;gap :10px;background-color:transparent;text-decoration:none;" >
                            <span class="image">
                                <img src="{% static 'images/StudySyn.svg'%}" alt="">
                            </span>
                            <div class="text logo-text">
                                <span class="name">ClassSphere</span>
                            </div>
                        </a>
                    </div>
                </header>
                <div class="menu-bar">
                    <div class="menu">
                       
                        <ul class="menu-links">
                            <li class="nav-link Home">
                                <a href="/">
                                    <i class='bx bx-home-alt icon'></i>
                                    <span class="text nav-text">Home</span>
                                </a>
                            </li>
                            <li class="nav-link">
                                <a href="{% url 'adminpage' %}">
                                    <i class='bx bx-chart icon'></i>  
                                    <span class="text nav-text">Dashboard</span>
                                </a>
                            </li>
                            <li class="nav-link">
                                <a href="{% url 'userprofile'%}">
                                    <i class='bx bxs-user-detail icon'></i>
                                    <span class="text nav-text">Profile</span>
                                </a>
                            </li>
                            <li class="nav-link setupfees">
                                <a href="{% url 'feesetup'%}">
                                    <i class="bx bx-money icon"></i>
                                    <span class="text nav-text">SetUp fee</span>
                                </a>
                            </li>
                            <li class="nav-link">
                                <a href="{% url 'holidaycrud'%}">
                                    <i class="fas fa-umbrella-beach icon"></i>
                                    <span class="text nav-text">Holiday</span>
                                </a>
                            </li>
                            <li class="nav-link">
                                <a href="#">
                                    <i class="bx bx-calendar-event icon"></i>
                                    <span class="text nav-text">Events</span>
                                </a>
                            </li>
                            <li class="nav-link Fees">
                                <a href="{% url 'pay'%}">
                                    <i class='bx bx-bar-chart-alt-2 icon'></i>
                                    <span class="text nav-text">Fees</span>
                                </a>
                            </li>
                            <li class="nav-link Notifications">
                                <a href="{% url 'Notification'%}">
                                    <i class='bx bx-bell icon'></i>
                                    <span class="text nav-text">Notifications</span>
                                </a>
                            </li>
                            <li class="nav-link  Exam">
                                <a href="{% url 'schedule'%}"> 
                                    <i class='bx bxs-report icon'></i>
                                    <span class="text nav-text"> Exam</span>
                                </a>
                            </li>
                            <li class="nav-link  Create">
                                <a href="{% url 'createExam'%}"> 
                                    <i class='bx bx-plus-circle icon'></i>
                                    <span class="text nav-text">Create Exam</span>
                                </a>
                            </li>
                            <li class="nav-link Attendance">
                                <a href="{% url 'attendance' %}">
                                    <i class='bx bx-heart icon'></i>
                                    <span class="text nav-text">Attendance</span>
                                </a>
                            </li>
                           
                        </ul>
                    </div>
                    <div class="bottom-content" style="margin-bottom: 2rem;">
                        <li class="">
                            <a href="{% url 'logout'%}">
                                <i class='bx bx-log-out icon'></i>
                                <span class="text nav-text">Logout</span>
                            </a>
                        </li>
                    </div>
                </div>
            </nav> 
        </body>
        </html>
