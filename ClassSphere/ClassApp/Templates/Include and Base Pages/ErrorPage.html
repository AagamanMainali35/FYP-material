<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | School Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --secondary: #0ea5e9;
            --accent: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --red: #ef4444;
            --blue: #3b82f6;
            --yellow: #eab308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(25, 29, 31, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            padding: 2rem;
        }

        .classroom {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin: 0 auto 2rem;
            background-color: var(--gray-100);
            border-radius: 16px;
            overflow: hidden;
        }

        .classroom-board {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 180px;
            background-color: #27272a;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 1.5rem;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .error-code .digit {
            display: inline-block;
            animation: bounce 2s ease infinite;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .error-code .digit:nth-child(2) {
            animation-delay: 0.2s;
        }

        .error-code .digit:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .error-message {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--gray-300);
        }

        .classroom-desk {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            background-color: #92400e;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .classroom-desk::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 20px;
            width: 20px;
            height: 20px;
            background-color: #78350f;
            border-radius: 0 0 4px 4px;
        }

        .classroom-desk::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: 20px;
            width: 20px;
            height: 20px;
            background-color: #78350f;
            border-radius: 0 0 4px 4px;
        }

        .school-supplies {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .pencil {
            position: absolute;
            top: 260px;
            left: 300px;
            width: 10px;
            height: 120px;
            background-color: #fbbf24;
            border-radius: 5px;
            transform: rotate(-30deg);
            transform-origin: bottom center;
            animation: pencilRoll 8s ease-in-out infinite;
        }

        .pencil::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 20px;
            background-color: #1e293b;
            border-radius: 5px 5px 0 0;
        }

        .pencil::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background-color: #f87171;
            border-radius: 0 0 5px 5px;
        }

        @keyframes pencilRoll {
            0%, 100% {
                transform: rotate(-30deg);
            }
            50% {
                transform: rotate(-40deg) translateY(-10px);
            }
        }

        .notebook {
            position: absolute;
            top: 280px;
            right: 280px;
            width: 80px;
            height: 100px;
            background-color: var(--blue);
            border-radius: 4px;
            transform: rotate(15deg);
            animation: notebookFloat 5s ease-in-out infinite;
        }

        .notebook::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 60px;
            height: 80px;
            background-color: white;
            border-radius: 2px;
        }

        .notebook::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 15px;
            width: 50px;
            height: 2px;
            background-color: var(--gray-300);
            box-shadow: 0 10px 0 var(--gray-300), 0 20px 0 var(--gray-300), 0 30px 0 var(--gray-300), 0 40px 0 var(--gray-300), 0 50px 0 var(--gray-300);
        }

        @keyframes notebookFloat {
            0%, 100% {
                transform: rotate(15deg);
            }
            50% {
                transform: rotate(20deg) translateY(-10px);
            }
        }

        .ruler {
            position: absolute;
            top: 320px;
            left: 400px;
            width: 150px;
            height: 20px;
            background-color: #fef3c7;
            border-radius: 2px;
            transform: rotate(-10deg);
            animation: rulerSlide 7s ease-in-out infinite;
        }

        .ruler::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 140px;
            height: 2px;
            background-color: var(--gray-500);
            box-shadow: 0 8px 0 var(--gray-500);
        }

        .ruler::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10px;
            width: 2px;
            height: 10px;
            background-color: var(--gray-500);
            box-shadow: 20px 0 0 var(--gray-500), 40px 0 0 var(--gray-500), 60px 0 0 var(--gray-500), 80px 0 0 var(--gray-500), 100px 0 0 var(--gray-500), 120px 0 0 var(--gray-500), 140px 0 0 var(--gray-500);
        }

        @keyframes rulerSlide {
            0%, 100% {
                transform: rotate(-10deg);
            }
            50% {
                transform: rotate(-5deg) translateX(20px);
            }
        }

        .eraser {
            position: absolute;
            top: 300px;
            right: 400px;
            width: 40px;
            height: 20px;
            background-color: #f87171;
            border-radius: 4px;
            transform: rotate(25deg);
            animation: eraserMove 6s ease-in-out infinite;
        }

        .eraser::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 15px;
            height: 20px;
            background-color: #60a5fa;
            border-radius: 0 4px 4px 0;
        }

        @keyframes eraserMove {
            0%, 100% {
                transform: rotate(25deg);
            }
            50% {
                transform: rotate(15deg) translateY(-15px);
            }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--gray-500);
            max-width: 600px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .classroom {
                height: 300px;
            }

            .classroom-board {
                width: 80%;
                height: 140px;
                top: 30px;
            }

            .error-code {
                font-size: 3.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .pencil, .notebook, .ruler, .eraser {
                transform: scale(0.8);
            }
        }

        @media (max-width: 480px) {
            .classroom {
                height: 250px;
            }

            .classroom-board {
                width: 90%;
                height: 120px;
                top: 20px;
            }

            .error-code {
                font-size: 3rem;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="classroom">
            <div class="classroom-board">
                <div class="error-code">
                    <span class="digit">4</span>
                    <span class="digit">0</span>
                    <span class="digit">4</span>
                </div>
                <div class="error-message">Page Not Found</div>
            </div>
            
            <div class="classroom-desk"></div>
            
            <div class="school-supplies">
                <div class="pencil"></div>
                <div class="notebook"></div>
                <div class="ruler"></div>
                <div class="eraser"></div>
            </div>
        </div>
        
        <h1 class="title">Oops! Lesson Not Found</h1>
        <p class="subtitle">
            It seems this page has been marked absent from our school system. 
            Don't worry, our teachers are looking into it!
        </p>
        
        <div class="buttons">
            <a href="/" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Return to Homepage
            </a>
            <a href="/#ContactForm" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                Contact Support
            </a>
        </div>
    </div>
</body>
</html>
